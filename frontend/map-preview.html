<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>downtown.tmx — map preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1b22;
        overflow: hidden;
      }
      #game {
        width: 100vw;
        height: 100vh;
      }
      canvas {
        display: block;
      }
      .video-modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.78);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .video-modal {
        position: relative;
        width: min(86vw, 900px);
      }
      .video-modal-frame {
        position: relative;
        width: 100%;
        padding-top: 56.25%; /* 16:9 */
      }
      .video-modal-frame iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 8px;
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
      }
      .video-modal-close {
        position: absolute;
        top: -16px;
        right: -16px;
        width: 34px;
        height: 34px;
        border: 0;
        border-radius: 50%;
        background: #fff;
        color: #111;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        z-index: 1;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/mapPreview/main.js"></script>
  </body>
</html>
