# Local-dev conveniences. Docker Compose auto-loads this file on a plain
# `docker compose up`, so on your laptop the backend and database are published
# to localhost (handy for `curl localhost:3190/...` or a psql client).
#
# The homeserver runs `docker compose -f compose.yaml up` (explicit -f), which
# does NOT load this file, so there it publishes only the frontend port.
services:
  backend:
    ports:
      - "3190:3190"
    volumes:
      # Read-only view of the repo's git dir so the dev staleness signal
      # (issue #225) can compare the sha captured at boot with the working
      # tree's current HEAD. See backend/config/initializers/dev_staleness.rb.
      - ./.git:/repo.git:ro
    environment:
      # Local posture-login (issue #24) runs on the host at :3000; the backend
      # reaches it for the server-to-server gate calls via host.docker.internal,
      # but the browser opens the hosted page at localhost:3000 — so the backend
      # rewrites hosted_url's origin to this public base.
      POSTURE_SERVICE_URL: http://host.docker.internal:3000
      POSTURE_PUBLIC_URL: http://localhost:3000
      # Registered Game App creds — real values live in a gitignored .env;
      # defaults fall back to the posture-login dev seed so `up` works without it.
      POSTURE_CLIENT_ID: ${POSTURE_CLIENT_ID:-dev-game-app}
      POSTURE_CLIENT_SECRET: ${POSTURE_CLIENT_SECRET:-dev-secret-do-not-use-in-prod}
  db:
    ports:
      - "5432:5432"
