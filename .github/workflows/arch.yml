# Architecture conformance — the enforcement foundation for ADR-0010.
#
# Runs the frontend dependency-cruiser check (`pnpm arch`, which ignores the
# baselined known-violations and fails only on NEW divergences) on every pull
# request AND on every push to `main`. The push trigger is deliberate: the
# Sandcastle AFK loop merges locally and pushes to `main` without opening PRs,
# so a PR-only trigger would never see that code. Branch protection is
# intentionally NOT enabled (issue #215 / PRD #214) — it would block those
# direct pushes and break the loop.
#
# Backend jobs live here too: `schema-lint` enforces ADR-0010's DB conventions
# (issue #220) and `structure-lint` enforces its file layout — no flat files
# outside a domain namespace (issue #221). Later slices add the test suite.
name: Architecture

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend-arch:
    name: Frontend architecture check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # pnpm must be installed before setup-node so `cache: pnpm` resolves the
      # pnpm store. Version is read from the root package.json packageManager
      # field (pnpm@11.5.0).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run architecture check
        run: pnpm arch

  schema-lint:
    name: Schema lint (ADR-0010)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Pure-bash lint of db/schema.rb — no Ruby, gems, or database needed.
      # Enforces the FK allowlist and module-prefix rules from ADR-0010.
      - name: Run schema lint
        run: bash script/schema-lint.sh

  structure-lint:
    name: Structure lint (ADR-0010)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Pure-bash check of the app tree — no Ruby, gems, or database needed.
      # Fails any .rb file that lands flat outside a domain namespace in
      # app/models, app/controllers/api/v1, or app/serializers (ADR-0010).
      - name: Run structure lint
        run: bash script/structure-lint.sh
