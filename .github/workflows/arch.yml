# Arch guard (#179/#182): dependency-cruiser must pass on every PR and every
# push to main — the authoritative net behind the local pre-commit hook
# (which can be skipped with --no-verify or on machines without docker).
name: arch

on:
  pull_request:
  push:
    branches: [main]

jobs:
  arch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm arch
