# Local development stack: Postgres + Rails API + Vite dev server.
# Usage: docker compose up --build
#
# DEV ONLY. Production deploys via Kamal (backend/Dockerfile) + the homeserver
# tunnel — this file does not touch that path.
#
# Named volumes hold the dependencies (bundle, node_modules) so platform-specific
# native binaries are built inside the Linux containers and never shadowed by the
# macOS host's copies via the bind mounts.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: one_rev_village_development
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      RAILS_ENV: development
      PORT: "3190"
      DATABASE_URL: postgres://postgres:postgres@db:5432/one_rev_village_development
    command: bash -c "rm -f tmp/pids/server.pid && bundle install && bin/rails db:prepare && bin/rails server -b 0.0.0.0 -p 3190"
    volumes:
      - ./backend:/app
      - bundle:/usr/local/bundle
    ports:
      - "3190:3190"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      # Vite proxies /api here (see frontend/vite.config.js).
      VITE_PROXY_TARGET: http://backend:3190
    command: bash -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5460:5460"
    depends_on:
      - backend

volumes:
  pgdata:
  bundle:
  frontend_node_modules:
