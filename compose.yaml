# Dev stack: Postgres + Rails API + Vite dev server. This file is the DEV base
# (hot reload); the homeserver layers compose.prod.yaml on top to harden it.
#
#   Local dev:   docker compose up --build
#                (auto-loads compose.override.yaml, which also publishes the
#                 backend + database to localhost for convenient curling)
#
#   Homeserver:  docker compose -f compose.yaml -f compose.prod.yaml up -d --build
#                (explicit -f skips the local override; compose.prod.yaml runs
#                 Keycloak in prod mode on Postgres and serves a frontend prod
#                 build. The Cloudflare tunnels forward odt-ville.p2d.uk and
#                 odt-ville-auth.p2d.uk to the published frontend/Keycloak ports;
#                 backend + db stay private. See compose.prod.yaml — issue #96.)
#
# Named volumes hold the dependencies (bundle, node_modules) so platform-specific
# native binaries are built inside the Linux containers and never shadowed by the
# host's copies via the bind mounts.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: one_rev_village_development
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Host port is published only for local dev (see compose.override.yaml);
    # on the homeserver the database stays private to the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      RAILS_ENV: development
      PORT: "3190"
      DATABASE_URL: postgres://postgres:postgres@db:5432/one_rev_village_development
      # Posture-login gate (issue #24). Creds come from the host's gitignored
      # .env (dev fallbacks let `up` work without one). URLs default to the
      # deployed posture-login service; compose.override.yaml swaps them for
      # localhost in local dev.
      POSTURE_SERVICE_URL: https://posture-login.p2d.uk
      POSTURE_PUBLIC_URL: https://posture-login.p2d.uk
      POSTURE_CLIENT_ID: ${POSTURE_CLIENT_ID:-dev-game-app}
      POSTURE_CLIENT_SECRET: ${POSTURE_CLIENT_SECRET:-dev-secret-do-not-use-in-prod}
      # Keycloak auth (issue #92). The token's `iss` reflects the browser/host
      # origin (localhost:8080), so we validate `iss` against that, but fetch the
      # JWKS over the private compose network (keycloak:8080) — same keys, no
      # public round-trip.
      KEYCLOAK_ISSUER: http://localhost:8080/realms/odtville
      KEYCLOAK_AUDIENCE: odt-ville-web
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/odtville/protocol/openid-connect/certs
      # LiveKit SFU voice (ADR-0011, #298). Room tokens are minted server-side
      # from this key/secret — they are NEVER sent to the browser. Supply via the
      # host's gitignored .env; absent = voice disabled (mirrors VITE_TURN, #283).
      # These MUST NOT gain a VITE_ prefix — that would inline them into the client
      # bundle, the one unrecoverable mistake this issue guards against (#298).
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # Basecamp 5 avatar sync (ADR-0012, #319). Server-only OAuth 2 app creds
      # plus the refresh token + account id produced by the one-time
      # authorization hop in the ADR. Supply via the host's gitignored .env;
      # absent = no sync, users keep the fallback avatar. Like LIVEKIT_*, these
      # MUST NOT gain a VITE_ prefix — Basecamp's people data and the token that
      # reads it never belong in the client bundle.
      BASECAMP_CLIENT_ID: ${BASECAMP_CLIENT_ID:-}
      BASECAMP_CLIENT_SECRET: ${BASECAMP_CLIENT_SECRET:-}
      BASECAMP_REFRESH_TOKEN: ${BASECAMP_REFRESH_TOKEN:-}
      BASECAMP_ACCOUNT_ID: ${BASECAMP_ACCOUNT_ID:-}
      # Eira card ingest (#317). The shared service token Eira presents on
      # POST /api/v1/cards/event — service-to-service, never a user session.
      # Supply via the host's gitignored .env; absent = the ingest fails closed
      # and rejects every call, which is the correct posture until the
      # credential exchange in #331. Like the above, MUST NOT gain a VITE_
      # prefix: a token in the client bundle is a token anyone can post with.
      ODT_VILLE_INGEST_TOKEN: ${ODT_VILLE_INGEST_TOKEN:-}
      # Eira bulk card read (#318). The token we present OUTBOUND on
      # POST /cards/lookup to seed everyone's card on world entry — a different
      # credential from the ingest token above, and equally server-only.
      # Eira is a plain Node app on the same box, so this is the host's own
      # loopback with no Cloudflare in the path; from inside the container that
      # address is the host gateway, which extra_hosts names below.
      # Absent token = no call at all: blank badges that self-heal on the next
      # card event, which is the correct posture for ambient data.
      EIRA_SERVICE_TOKEN: ${EIRA_SERVICE_TOKEN:-}
      EIRA_URL: ${EIRA_URL:-http://host.docker.internal:3150}
    # Docker Desktop resolves host.docker.internal already; the homeserver's
    # Linux engine does not, so name it explicitly (see EIRA_URL above).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: bash -c "rm -f tmp/pids/server.pid && bundle install && bin/rails db:prepare && bin/rails server -b 0.0.0.0 -p 3190"
    volumes:
      - ./backend:/app
      - bundle:/usr/local/bundle
    # Reachable in-network as `backend:3190` (the Vite proxy targets that). The
    # host port is published only for local dev (see compose.override.yaml).
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      # Vite proxies /api here (see frontend/vite.config.js).
      VITE_PROXY_TARGET: http://backend:3190
      # PostHog analytics (issue #101). Set the project key to enable; absent =
      # no-op. Keep the secret out of git — supply via the host env, e.g.
      # `VITE_POSTHOG_KEY=phc_xxx docker compose up`. Host defaults to US cloud.
      VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
      # Target of every in-world board's "open content list" action (#335) —
      # a public URL, not a secret; supplied from the host .env like the rest.
      # Absent = the press opens nothing (the ODDS deployment sets its demo
      # Basecamp board here). Retired by per-board content views (#15).
      VITE_BOARD_URL: ${VITE_BOARD_URL:-}
      # LiveKit server URL (ADR-0011, #298). NOT a secret — the browser dials it
      # directly (wss://…livekit.cloud) and the backend-minted token authorizes
      # the join. Supplied from the host .env, as VITE_TURN_URL was (#283).
      VITE_LIVEKIT_URL: ${VITE_LIVEKIT_URL:-}
    command: bash -c "pnpm install && pnpm run dev --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      # The public app. On the homeserver the Cloudflare tunnel forwards
      # odt-ville.p2d.uk -> localhost:5460.
      - "5460:5460"
    depends_on:
      - backend

  # Keycloak with a committed dev realm (issue #92). `start-dev --import-realm`
  # re-imports realm-export.json on every boot, so the realm (the web client
  # with Direct Access Grants, the seeded alice/bob/carol with pinned UUIDs +
  # password `dev`) is source-controlled and reproducible. Storage is the
  # default embedded H2 (ephemeral) — fine because the realm re-imports on boot.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"

volumes:
  pgdata:
  bundle:
  frontend_node_modules:
